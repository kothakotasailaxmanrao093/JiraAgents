[project]
name = "jira-requirement-review"
version = "2.2.22"
description = "Reviews a Jira requirement against its parent, sub-tasks, linked issues and attachments, and reports what is assumed, ambiguous or missing"
authors = [{ name = "Kothakota Sai Laxman Rao", email = "kothakota.sailaxmanrao@calfus.com" }]
readme = "README.md"
# The only aetherion-sdk wheel is cp312, so 3.13 cannot resolve. Allowing
# <3.14 made uv's universal resolver try 3.13 and fail with "no wheels with a
# matching Python version tag" — a plain `uv run pytest` could not start.
requires-python = ">=3.12.10,<3.13"


dependencies = [
    # graphql-core 3.3.0 (27 Sep 2026) removed graphql.execution.ExecutionContext,
    # which strawberry 0.287.3 imports via the platform's phoenix/agent_lib: the
    # worker pod crashed on start-up. Remove once the platform image supports 3.3.
    "graphql-core>=3.2,<3.3",
    "aetherion-sdk @ https://sdk.sbox.aetherion.io/Darwin/aetherion_sdk-0.0.67-cp312-cp312-macosx_26_0_arm64.whl",
    "aiohttp==3.13.5",
    "pydantic>=2.7",
    "python-dotenv>=1.0.1",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.3.0",
    "ruff==0.12.12",
    "black==25.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
