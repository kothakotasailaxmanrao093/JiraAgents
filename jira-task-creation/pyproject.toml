[project]
name = "jira-task-creation"
version = "4.3.37"
description = "LaxmanTicketWise — validates requirements, classifies them Small/Medium/Large, decomposes them into Epics/Stories/Subtasks, and creates the Jira hierarchy"
authors = [{ name = "Kothakota Sai Laxman Rao", email = "kothakota.sailaxmanrao@calfus.com" }]
readme = "README.md"
# The only aetherion-sdk wheel is cp312 (macOS arm64), so 3.13 cannot resolve.
# Allowing <3.14 made uv's universal resolver try 3.13 and fail with
# "no wheels with a matching Python version tag".
requires-python = ">=3.12.10,<3.13"


dependencies = [
    "aetherion-sdk @ https://sdk.sbox.aetherion.io/Darwin/aetherion_sdk-0.0.83-cp312-cp312-macosx_26_0_arm64.whl",
    # Imported directly by src/; previously satisfied only transitively via the
    # SDK, which breaks the moment the SDK drops one of them.
    "fastapi>=0.120,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.13,<3.0",
    "python-dotenv>=1.2,<2.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.3.0",
    "ruff==0.12.12",
    "black==25.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into module internals deliberately.
"tests/*" = ["E501"]
# The agent signature keeps typing.Dict to match the Aetherion scaffold and the
# sibling asurint agent, whose payload type the platform resolves at deploy time.
"src/agent/agent.py" = ["UP006", "UP035"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
